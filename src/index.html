<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuget</title>
  <link rel="stylesheet" href="vendor/quill/quill.snow.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="left-panel" data-tauri-drag-region>
      <div class="clock-section">
        <div id="clock-time" class="clock-time">21:45</div>
        <div id="clock-date" class="clock-date">Thứ Tư<br>12/08/2026</div>
        <div id="lunar-date" class="lunar-date">19/06 Âm lịch</div>
      </div>
      <div class="weather-mini">
        <div id="weather-icon" class="weather-icon">☀️</div>
        <div id="weather-temp" class="weather-temp">32°C</div>
        <div id="weather-humidity" class="weather-humidity">Độ ẩm 68%</div>
      </div>
    </div>

    <div class="right-panel" id="right-panel">
      <div class="drag-bar" data-tauri-drag-region data-i18n-title="dragHint"></div>
      <div class="panel-container" id="panel-container">
        <div class="panel" data-panel="0" id="panel-notes">
          <div class="panel-header">
            <span data-i18n="notes">Notes</span>
            <button class="note-add-btn" id="note-add-btn" data-i18n="addNote">+ Thêm</button>
          </div>
          <div class="notes-list" id="notes-list"></div>
        </div>

        <div class="panel" data-panel="1" id="panel-weather">
          <div class="panel-header" data-i18n="weatherToday">Thời tiết hôm nay</div>
          <div class="weather-current">
            <span id="current-temp" class="current-temp">32°C</span>
            <span id="current-desc" class="current-desc">Trời trong</span>
          </div>
          <div class="weather-forecast" id="weather-forecast"></div>
        </div>

        <div class="panel" data-panel="2" id="panel-sysmon">
          <div class="panel-header" data-i18n="systemMonitor">System Monitor</div>
          <div class="sysinfo-grid" id="sysinfo-grid"></div>
        </div>

        <div class="panel" data-panel="3" id="panel-calendar">
          <div class="panel-header">
            <button class="cal-nav" id="cal-prev">‹</button>
            <span id="cal-title">Tháng 8 2026</span>
            <button class="cal-nav" id="cal-next">›</button>
            <button class="cal-nav" id="cal-today" data-i18n="today">Hôm nay</button>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <div class="panel" data-panel="4" id="panel-settings">
          <div class="panel-header" data-i18n="settings">Thiết lập</div>
          <div class="settings-group">
            <div class="settings-row">
              <div>
                <div class="settings-label" data-i18n="appearance">Giao diện</div>
                <div class="settings-hint" data-i18n="appearanceHint">Chọn tông màu</div>
              </div>
            </div>
            <div class="theme-grid" id="theme-grid"></div>
          </div>
          <div class="settings-group">
            <div class="settings-row">
              <span class="settings-label" data-i18n="opacity">Độ trong suốt</span>
              <div style="display:flex;align-items:center;gap:8px">
                <input type="range" id="opacity-range" class="range" min="0.6" max="1" step="0.02">
                <span class="range-value" id="opacity-value"></span>
              </div>
            </div>
            <div class="settings-row">
              <span class="settings-label" data-i18n="language">Ngôn ngữ</span>
              <div class="lang-pills" id="lang-pills">
                <button class="lang-pill" data-lang="vi">Vi</button>
                <button class="lang-pill" data-lang="en">En</button>
                <button class="lang-pill" data-lang="zh">中</button>
              </div>
            </div>
            <div class="settings-row">
              <span class="settings-label" data-i18n="autostart">Khởi động cùng Windows</span>
              <div class="toggle" id="toggle-autostart"></div>
            </div>
            <div class="settings-row">
              <span class="settings-label" data-i18n="updateLabel">Cập nhật</span>
              <div class="action-btns">
                <span class="settings-hint" id="update-status"></span>
                <button class="icon-btn" id="btn-check-update" data-i18n-title="checkUpdate" aria-label="Check updates">
                  <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </button>
                <button class="icon-btn" id="btn-restart-app" data-i18n-title="restartApp" aria-label="Restart">
                  <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
                <button class="icon-btn danger" id="btn-force-quit" data-i18n-title="forceClose" aria-label="Quit">
                  <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="settings-group">
            <div class="settings-row">
              <div>
                <div class="settings-label" data-i18n="syncLabel">Đồng bộ note</div>
                <div class="settings-hint" data-i18n="syncHint">Đồng bộ qua đám mây bằng mã 6 số</div>
              </div>
            </div>
            <div class="sync-box">
              <div class="sync-code-line">
                <span class="sync-code-caption" data-i18n="syncCurrentCode">Mã hiện tại</span>
                <span class="sync-code" id="sync-code-display">—</span>
                <button class="sync-mini" id="sync-copy" data-i18n="syncCopy">Chép</button>
                <button class="sync-mini" id="sync-unlink" data-i18n="syncUnlink">Bỏ liên kết</button>
              </div>
              <div class="sync-row">
                <input class="sync-input" id="sync-input" inputmode="numeric" maxlength="6"
                       data-i18n-ph="syncEnterCode" placeholder="Nhập mã 6 số...">
                <button class="sync-btn" id="sync-pull-btn" data-i18n="syncPull">Tải về</button>
              </div>
              <div class="sync-row">
                <button class="sync-btn sync-btn-alt" id="sync-new-btn" data-i18n="syncNewCode">Tạo mã mới</button>
                <button class="sync-btn sync-btn-alt" id="sync-push-btn" data-i18n="syncPushNow">Đồng bộ ngay</button>
              </div>
              <div class="sync-status" id="sync-status"></div>
            </div>
          </div>
        </div>

        <div class="panel" data-panel="5" id="panel-about">
          <div class="panel-header" data-i18n="version">Phiên bản</div>
          <div class="about-content" id="about-content"></div>
        </div>
      </div>
      <div class="panel-dots" id="panel-dots"></div>
    </div>
  </div>

  <div class="note-modal-overlay" id="note-modal">
    <div class="note-modal">
      <input class="note-modal-title" id="note-modal-title" data-i18n-ph="noteTitlePlaceholder" placeholder="Tiêu đề..." spellcheck="false">
      <div class="note-modal-toolbar" id="note-toolbar">
        <span class="ql-formats">
          <select class="ql-header">
            <option value="1"></option>
            <option value="2"></option>
            <option selected></option>
          </select>
        </span>
        <span class="ql-formats">
          <button class="ql-bold" type="button"></button>
          <button class="ql-italic" type="button"></button>
          <button class="ql-strike" type="button"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="ordered" type="button"></button>
          <button class="ql-list" value="bullet" type="button"></button>
          <button class="ql-list" value="check" type="button"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-blockquote" type="button"></button>
          <button class="ql-link" type="button"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-clean" type="button"></button>
        </span>
      </div>
      <div class="note-modal-body" id="note-modal-body"></div>
      <div class="note-modal-footer">
        <button class="nm-toggle" id="nm-pin" data-i18n="pin">Ghim</button>
        <button class="nm-toggle" id="nm-hide" data-i18n="hideContent">Ẩn nội dung</button>
        <span class="nm-autosave" id="nm-autosave" data-i18n="autosaved">Đã tự lưu</span>
        <button class="nm-danger" id="nm-delete" data-i18n="delete">Xóa</button>
        <button class="nm-primary" id="nm-close" data-i18n="done">Xong</button>
      </div>
    </div>
  </div>

  <script src="vendor/quill/quill.js"></script>
  <script src="app.js"></script>
</body>
</html>
